<div class="w-full flex justify-between">
  <app-title-header
    title="Administradores"
    subtitle="Veja a informação de todos os administradores da plataforma"
    name="{{ admin()?.name }}"
  ></app-title-header>

  <button
    (click)="openRegisterModal()"
    class="bg-tertiary px-5 py-2.25 flex items-center justify-center h-fit gap-2 text-[13px] text-white rounded-lg hover:bg-tertiary/50 hover:scale-105 cursor-pointer transition-all duration-300"
  >
    <img src="/images/icons/dashboard/plus-new.svg" alt="" /> Novo
  </button>
</div>

<div class="mt-7.25">
  <app-administrators-table></app-administrators-table>
</div>

@if (isRegisterModalOpen()) {
  <app-register-admin-modal (close)="closeRegisterModal()" (success)="onAdminRegistered()" />
}
