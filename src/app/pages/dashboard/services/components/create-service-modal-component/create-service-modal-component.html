<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
  <div class="bg-white rounded-2xl w-full max-w-313 overflow-hidden shadow-xl flex flex-col p-7.5">
    <div class="flex justify-between mb-4.75">
      <h3 class="text-[30px] font-semibold">Novo Serviço</h3>
      <button
        (click)="onClose()"
        class="p-1 w-8 h-8 flex items-center justify-center rounded-full text-[#464E5F] hover:text-gray-500 bg-gray-100 transition-colors cursor-pointer"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <hr class="border border-[#858585]" />

    <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()" class="flex flex-col mt-7.5">
      <div class="flex w-full gap-15">
        <div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1"
              >Título do Serviço *</label
            >
            <input
              type="text"
              formControlName="title"
              placeholder="Ex: Consultoria Técnica"
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1"
              >ID do Profissional *</label
            >
            <input
              type="number"
              formControlName="professionalId"
              placeholder="Ex: 1"
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Categoria *</label>
              <input
                type="text"
                formControlName="category"
                placeholder="Ex: Tecnologia"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>

            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Tipo *</label>
              <select
                formControlName="type"
                class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              >
                <option value="hub">Hub</option>
                <option value="freelance">Freelance</option>
              </select>
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Preço (AOA) *</label>
            <input
              type="number"
              formControlName="price"
              placeholder="0.00"
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Descrição</label>
            <textarea
              formControlName="description"
              rows="3"
              placeholder="Descreva brevemente o serviço..."
              class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
            ></textarea>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Adicione do Serviço</label>
          <div
            class="border-2 border-dashed border-gray-200 rounded-xl p-4 text-center cursor-pointer hover:border-blue-400 relative bg-gray-50"
          >
            <input
              type="file"
              accept="image/*"
              (change)="onFileSelected($event)"
              class="absolute inset-0 opacity-0 cursor-pointer"
            />
            @if (previewImage()) {
              <img [src]="previewImage()" class="h-32 w-full object-cover rounded-lg mx-auto" />
            } @else {
              <div class="text-gray-400 text-xs py-4">
                <p class="font-medium">Clique para carregar uma imagem</p>
                <p class="text-[10px] text-gray-400 mt-1">PNG, JPG até 5MB</p>
              </div>
            }
          </div>
        </div>
      </div>
      <div class="pt-3 flex justify-end gap-2 border-t border-gray-100">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 border border-gray-200 rounded-lg text-xs font-semibold text-gray-600 hover:bg-gray-50 cursor-pointer"
        >
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="px-5 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold hover:bg-blue-700 disabled:opacity-50 cursor-pointer"
        >
          {{ isSubmitting() ? 'A guardar...' : 'Guardar Serviço' }}
        </button>
      </div>
    </form>
  </div>
</div>
