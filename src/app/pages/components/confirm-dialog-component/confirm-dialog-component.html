@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center font-inter justify-center p-4 bg-black/50 backdrop-blur-xs transition-opacity duration-200"
  >
    <div
      class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 transform transition-all flex flex-col gap-4 animate-in fade-in zoom-in-95 duration-150"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center gap-3">
        <div>
          <h3 class="text-lg font-semibold leading-6">{{ title() }}</h3>
          <p class="text-xs mt-0.5">Ação destrutiva</p>
        </div>
      </div>

      <div class="text-sm text-gray-600">
        <p>{{ message() }}</p>
      </div>

      <div class="flex items-center justify-end gap-3 mt-2">
        <button
          type="button"
          (click)="onCancel()"
          [disabled]="isLoading()"
          class="px-4 py-2.5 text-sm font-semibold  bg-gray-200 hover:bg-gray-300 rounded-lg transition-colors disabled:opacity-50 cursor-pointer"
        >
          {{ cancelText() }}
        </button>

        <button
          type="button"
          (click)="onConfirm()"
          [disabled]="isLoading()"
          class="px-4 py-2.5 text-sm font-semibold text-white bg-red-600 hover:bg-red-700 active:bg-red-800 rounded-lg transition-colors flex items-center gap-2 disabled:opacity-50 cursor-pointer"
        >
          @if (isLoading()) {
            <span
              class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"
            ></span>
            <span>A processar...</span>
          } @else {
            <span>{{ confirmText() }}</span>
          }
        </button>
      </div>
    </div>
  </div>
}
